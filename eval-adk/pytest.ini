[pytest]
# Pytest configuration for ADK evaluations

# Set asyncio mode (required for async tests)
asyncio_mode = auto

# Increase timeout for slow operations
# Each test can take up to 10 minutes (600 seconds)
timeout = 600

# Markers for test organization
markers =
    adk: ADK evaluation tests
    category: Single category evaluation
    agents: Multi-agent evaluation
    asyncio: Async test
